[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcapp_nucleo"
version = "0.1.0"
description = "Núcleo de análisis para la aplicación de investigación sobre modelos prescriptivos."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "scipy",
    "scikit-learn",
    "causal-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not lento'"
markers = [
    "lento: pruebas de aceptación con datasets reales y PC completo (ejecutar con: pytest -m lento)",
]
