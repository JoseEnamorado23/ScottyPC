[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcapp_servidor"
version = "0.1.0"
description = "Sidecar local (FastAPI) que expone el núcleo de pc-app por HTTP."
requires-python = ">=3.11"
# pcapp_nucleo no está en PyPI: se instala antes, en modo editable (pip install -e ../nucleo).
dependencies = [
    "pcapp_nucleo",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pcapp_servidor.almacenamiento" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
